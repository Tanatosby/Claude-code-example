<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Panel de Control Industrial</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-body">
  <div class="login-container">
    <div class="login-logo">
      <span class="logo-icon">🏭</span>
      <h1>Panel de Control</h1>
      <p>Sistema de Monitoreo Industrial</p>
    </div>

    <form class="login-form" method="POST" action="/login">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" placeholder="Ingrese usuario" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="Ingrese contraseña" required autocomplete="current-password">
      </div>

      <div id="error-msg" class="error-msg" style="display:none">
        ❌ Usuario o contraseña incorrectos
      </div>

      <button type="submit" class="btn-login">Iniciar Sesión</button>
    </form>

    <div class="login-footer">
      <span class="status-dot online"></span> Sistema Operativo
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get('error')) {
      document.getElementById('error-msg').style.display = 'block';
    }
  </script>
</body>
</html>
